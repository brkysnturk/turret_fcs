<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="980" viewBox="0 0 1100 980" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#334155"/>
    </marker>
    <style>
      .b{fill:#fff;stroke:#334155;stroke-width:1.6}
      .d{fill:#e0f2fe;stroke:#0284c7;stroke-width:1.6}
      .w{fill:#fef3c7;stroke:#d97706;stroke-width:1.5}
      .g{fill:#dcfce7;stroke:#16a34a;stroke-width:1.5}
      .r{fill:#fee2e2;stroke:#dc2626;stroke-width:1.5}
      .t{font-size:14px;fill:#0f172a}
      .s{font-size:11.5px;fill:#475569}
      .h{font-size:17px;font-weight:700;fill:#0f172a}
      .l{stroke:#334155;stroke-width:1.5;fill:none;marker-end:url(#a)}
      .lt{font-size:11px;fill:#334155;font-weight:600}
    </style>
  </defs>
  <rect width="1100" height="980" fill="#f8fafc"/>
  <text x="28" y="38" class="h">Turret FCS — Main Loop and Engagement Flowchart</text>
  <text x="28" y="60" class="s">30 FPS perception loop; operator keys are evaluated once per frame; safety paths are latched.</text>

  <rect x="380" y="86" width="330" height="48" class="d"/>
  <text x="398" y="108" class="t">1. Camera frame (latest, stale-guarded)</text>
  <text x="398" y="125" class="s">C270 1280x720; dt and loop latency measured</text>

  <path class="l" d="M545 134 V164"/>
  <rect x="380" y="164" width="330" height="48" class="b"/>
  <text x="398" y="186" class="t">2. YOLOv8n + ByteTrack</text>
  <text x="398" y="203" class="s">conf threshold from selector (search/track)</text>

  <path class="l" d="M545 212 V242"/>
  <rect x="380" y="242" width="330" height="48" class="b"/>
  <text x="398" y="264" class="t">3. TargetSelector</text>
  <text x="398" y="281" class="s">track ID + spatial gate + dropout hysteresis</text>

  <path class="l" d="M545 290 V320"/>
  <rect x="380" y="320" width="330" height="64" class="d"/>
  <text x="398" y="342" class="t">4. FCSManager.update</text>
  <text x="398" y="359" class="s">Kalman CV, ego compensation, lead, gravity</text>
  <text x="398" y="375" class="s">range gate, lock hysteresis, hit probability</text>

  <path class="l" d="M545 384 V414"/>
  <rect x="380" y="414" width="330" height="54" class="w"/>
  <text x="398" y="436" class="t">5. Target detected?</text>
  <text x="398" y="453" class="s">best_box is not None</text>

  <path class="l" d="M380 441 H220 V486"/>
  <text x="260" y="432" class="lt">YES</text>
  <rect x="60" y="486" width="330" height="72" class="g"/>
  <text x="78" y="508" class="t">6a. Control mode</text>
  <text x="78" y="526" class="s">P MAX: Kp 0.22/0.11, EMA 0.85</text>
  <text x="78" y="543" class="s">RL MAX: pure PPO, NumPy 11-64-64-2</text>

  <path class="l" d="M225 558 V588"/>
  <rect x="60" y="588" width="330" height="58" class="b"/>
  <text x="78" y="610" class="t">7a. Command shaping</text>
  <text x="78" y="627" class="s">deadband, mode limits, acceleration clamp</text>

  <path class="l" d="M225 646 V676"/>
  <rect x="60" y="676" width="330" height="58" class="b"/>
  <text x="78" y="698" class="t">8a. UART TX + STM32</text>
  <text x="78" y="715" class="s">7-byte packet, 100 Hz, heartbeat safety</text>

  <path class="l" d="M225 734 V764"/>
  <rect x="60" y="764" width="330" height="52" class="b"/>
  <text x="78" y="786" class="t">9a. Servos + flywheel idle</text>
  <text x="78" y="803" class="s">pan/tilt PWM; flywheel spins when locked</text>

  <path class="l" d="M710 441 H830 V486"/>
  <text x="760" y="432" class="lt">NO</text>
  <rect x="710" y="486" width="330" height="72" class="w"/>
  <text x="728" y="508" class="t">6b. Patrol enabled?</text>
  <text x="728" y="526" class="s">yes: hold 1.5 s → return to 0/0</text>
  <text x="728" y="543" class="s">then Figure-8 scan ±45/±16 deg, 8 s</text>

  <path class="l" d="M875 558 V588"/>
  <rect x="710" y="588" width="330" height="58" class="b"/>
  <text x="728" y="610" class="t">7b. No target / STANDBY</text>
  <text x="728" y="627" class="s">send zero command; lock decays after tolerance</text>

  <rect x="710" y="676" width="330" height="140" class="r"/>
  <text x="728" y="700" class="t">Operator Y — fire only if</text>
  <text x="728" y="718" class="s">locked AND range_valid AND range_stable</text>
  <text x="728" y="738" class="s">AND fire_stage is None AND not E-STOP</text>
  <text x="728" y="760" class="s">SPINUP/SLEW → SETTLE 0.15 s → FIRING 80 ms</text>
  <text x="728" y="778" class="s">→ RECOVER 0.35 s → EVAL 1.5 s</text>
  <text x="728" y="800" class="s">post-fire lock grace 0.75 s</text>

  <path class="l" d="M545 441 V860"/>
  <text x="556" y="850" class="lt">EVERY FRAME</text>
  <rect x="290" y="860" width="520" height="70" class="g"/>
  <text x="308" y="884" class="t">HUD + Telemetry v2</text>
  <text x="308" y="902" class="s">reticle, lock bar, hit probability, event log; CSV + meta/events</text>
  <text x="308" y="918" class="s">keys: M mode, P patrol, Y fire, N abort, SPACE latched E-STOP, Q quit</text>

  <rect x="60" y="860" width="200" height="70" class="r"/>
  <text x="76" y="884" class="t">E-STOP</text>
  <text x="76" y="902" class="s">motors neutral</text>
  <text x="76" y="918" class="s">launcher cut</text>
</svg>
