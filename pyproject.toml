[project]
name = "turret_fcs"
version = "1.3.0"
requires-python = ">=3.9, <3.13"
dependencies = [
    "numpy==1.26.4",
    "opencv-python==4.10.0.84",
    "scipy==1.14.1",
    "matplotlib==3.9.2",
    "torch==2.5.1",
    "ultralytics==8.3.40",
    "lapx==0.5.12; sys_platform == 'win32'",
    "lap==0.5.13; sys_platform != 'win32'",
    "stable-baselines3==2.4.1",
    "gymnasium==1.0.0",
    "tensorboard==2.18.0",
    "pyserial==3.5",
    "pygrabber==0.2; sys_platform == 'win32'",
    "pyyaml==6.0.2",
    "optuna==4.1.0",
]

[project.optional-dependencies]
test = [
    "pytest==8.3.4",
]

[project.scripts]
turret-fcs = "turret_fcs.main:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
